name: Publish Hong Kong on Foot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack the map
        run: |
          cat site-bundle/map.zip.* > "${RUNNER_TEMP}/map.zip"
          unzip -q "${RUNNER_TEMP}/map.zip" -d _site
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the map
        id: deployment
        uses: actions/deploy-pages@v4
