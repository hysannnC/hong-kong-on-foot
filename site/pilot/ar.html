<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122922">
<link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="ar.css">
<script type="module" src="ar.mjs"></script><title>Camera walking pilot · Hong Kong on Foot</title>
</head>
<body>
<header><a id="back" href="./"><img src="../icons/icon-192.png" alt="" width="32" height="32">Hong Kong on Foot</a><button id="language" type="button">繁體中文</button></header>
<main>
<section class="intro"><h1 id="title"></h1><p id="subtitle"></p><div class="actions"><a class="ferry-link" id="ferry" href="ferry.html">Star Ferry AR walkthrough</a><button id="demo" class="primary" type="button"></button><button id="live" type="button"></button><button id="stop" type="button" hidden></button></div></section>
<div class="layout">
<section class="viewer" aria-label="Camera guidance">
  <video id="camera" autoplay muted playsinline hidden></video>
  <div id="scene" class="scene" aria-hidden="true"><div class="skyline"></div><div class="pavement"></div><div id="barrier" class="barrier" hidden></div></div>
  <canvas id="boxes" hidden aria-hidden="true"></canvas>
  <div class="viewer-top"><span id="mode"></span><span id="scan"></span></div>
  <div id="guide" class="guide" hidden aria-hidden="true">↑</div>
  <div class="instruction"><strong id="direction"></strong><small id="directionDetail"></small></div>
</section>
<aside><section class="panel"><h2 id="observationTitle"></h2><dl id="observations"></dl><p id="note" class="muted"></p></section>
<section class="panel"><h2 id="learnTitle"></h2><div id="learning" aria-live="polite"></div><button id="reset" type="button"></button></section></aside>
</div>
<p id="privacy" class="muted"></p>
</main>
</body></html>
